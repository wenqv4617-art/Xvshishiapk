name: Generate Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 发布 APK 到 Releases 需要写权限；不显式声明的话默认 GITHUB_TOKEN 可能只读，gh release create 会失败
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK with Gradle
        run: |
          for i in 1 2 3; do
            echo "=== gradle assembleDebug（第 $i 次尝试）==="
            if gradle assembleDebug; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "第 $i 次构建失败，60 秒后重试..."
              sleep 60
            fi
          done
          exit 1

      # 清理历史构建产物（防止 500MB 配额被频繁构建堆满；失败不影响构建）
      - name: Clean old artifacts
        continue-on-error: true
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            | jq -r '.artifacts[]?.id' | while read -r id; do
              [ -n "$id" ] && curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      # ★ 配额用量是延迟计算的（6-12h），删了也未必立刻释放；上传失败不拖垮构建
      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: StoryPhone-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      # ★ 发布到 Releases：artifact 有全账号共享的存储配额，满了就传不上去（本次就撞到了）。
      #   Release 资产不计入该配额，而且下载链接长期有效，更适合「打一个包自己装着用」。
      #   失败不影响构建结论（artifact 那一步成不成都不影响你在这里拿到 APK）。
      - name: Publish APK to Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          VER=${VER:-unknown}
          RUN_NUM=${{ github.run_number }}
          TAG="apk-v${VER}-${RUN_NUM}"
          TITLE="叙事诗小手机 APK v${VER} (build ${RUN_NUM})"
          NOTES=$(printf '自动构建的 debug APK（v%s）。\n\n提交：%s\n运行：%s/%s/actions/runs/%s\n\n下载下面 Assets 里的 app-debug.apk 安装即可。' \
            "$VER" "${{ github.sha }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease || echo "Release 发布失败，不影响构建"
